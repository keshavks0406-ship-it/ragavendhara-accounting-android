name: Build Ragavendhara Accounting APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install project dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Use JSON Capacitor configuration
        run: rm capacitor.config.ts

      - name: Create Android project
        run: npx cap add android

      - name: Synchronize Android project
        run: npx cap sync android

      - name: Fix Android printer thread issue
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("node_modules/@capgo/capacitor-printer/android/src/main/java/com/capgo/printer/Printer.java")

          if not path.exists():
              raise SystemExit("Printer.java not found. Cannot apply printing fix.")

          source = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r'(public void printWebView\(WebView webView, String name\) throws Exception\s*\{\s*if \(webView == null\) \{\s*throw new Exception\("WebView not available"\);\s*\}\s*)createWebPrintJob\(webView, name\);',
              re.MULTILINE
          )

          def fix_method(match):
              return match.group(1) + """activity.runOnUiThread(
                  new Runnable() {
                      @Override
                      public void run() {
                          createWebPrintJob(webView, name);
                      }
                  }
              );"""

          source, count = pattern.subn(fix_method, source, count=1)

          if count == 0:
              start = source.find("public void printWebView")
              end = source.find("// MARK:", start)
              if start >= 0 and "activity.runOnUiThread" in source[start:end if end >= 0 else len(source)]:
                  print("Printer already contains the UI-thread fix.")
              else:
                  raise SystemExit("Could not locate the expected printer method. No unsafe changes made.")
          else:
              path.write_text(source, encoding="utf-8")
              print("Successfully applied Android printer UI-thread fix.")
          PY

      # Rebuild launcher assets on every APK run
      - name: Generate R and Co Android launcher icons
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          root = Path("android/app/src/main/res")
          navy = "#071B43"
          white = "#FFFFFF"
          blue = "#4D8DDA"
          font_regular = "/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf"
          font_bold = "/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf"

          def make_icon(size, path, adaptive=False):
              image = Image.new("RGBA", (size, size), (0, 0, 0, 0) if adaptive else navy)
              draw = ImageDraw.Draw(image)
              if not adaptive:
                  # Contemporary, simple monogram tile with no extra pictograms.
                  draw.rounded_rectangle((0, 0, size, size), radius=int(size * .22), fill=navy)
              rfont = ImageFont.truetype(font_bold, int(size * .47))
              subfont = ImageFont.truetype(font_regular, int(size * .16))
              rbox = draw.textbbox((0, 0), "R", font=rfont)
              rwidth, rheight = rbox[2] - rbox[0], rbox[3] - rbox[1]
              rxy = ((size-rwidth)//2, int(size*.12)-rbox[1])
              draw.text(rxy, "R", font=rfont, fill=white)
              label = "& Co."
              bbox = draw.textbbox((0,0), label, font=subfont)
              tw = bbox[2]-bbox[0]
              draw.text(((size-tw)//2, int(size*.67)-bbox[1]), label, font=subfont, fill=blue if adaptive else white)
              return image

          sizes = {"mdpi":48, "hdpi":72, "xhdpi":96, "xxhdpi":144, "xxxhdpi":192}
          for density, size in sizes.items():
              folder = root / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              make_icon(size, folder / "ic_launcher.png").save(folder / "ic_launcher.png")
              make_icon(size, folder / "ic_launcher_round.png").save(folder / "ic_launcher_round.png")

          for density, size in {"mdpi":108, "hdpi":162, "xhdpi":216, "xxhdpi":324, "xxxhdpi":432}.items():
              folder = root / f"drawable-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              make_icon(size, folder / "ic_launcher_foreground.png", adaptive=True).save(folder / "ic_launcher_foreground.png")

          (root / "values").mkdir(parents=True, exist_ok=True)
          (root / "values" / "ic_launcher_background.xml").write_text(
              '<resources><color name="ic_launcher_background">#071B43</color></resources>\n',
              encoding="utf-8"
          )
          (root / "mipmap-anydpi-v26").mkdir(parents=True, exist_ok=True)
          (root / "mipmap-anydpi-v26" / "ic_launcher.xml").write_text(
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>\n',
              encoding="utf-8"
          )
          (root / "mipmap-anydpi-v26" / "ic_launcher_round.xml").write_text(
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>\n',
              encoding="utf-8"
          )
          print("Generated R & Co. launcher icons for all Android densities.")
          PY

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Ragavendhara-Accounting-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
